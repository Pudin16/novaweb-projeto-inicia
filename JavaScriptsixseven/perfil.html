<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Bem vindo ao Perfil</h1>
    </header>
    <main>
        <from>
            <div>
                <img src="controle.png" alt="Foto de perfil" whidth="200" height="200" 
                onmouseover="console.log('mouse sobre a imagem')">
            </div>
            <div>
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" name="nome" class="form-control"
                    value="Seu Nome">
            </div>
            <div>
                <label for="nascimento" class="form-label">Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" class="form-control"
                    value="1900-01-01">
            </div>
            <div class="form-group">
                <button type="button" class="btn btn-primary" onclick="mensagem()">
                    <span class="glyphicon glyphicon-save"></span> Salvar
                </button>
            </div>
        </from>
    </main>
    <script type="text/javascript">
        function mensagem() {
            alert("Perfil salvo com sucesso!");
        }
    </script>
</body>
</html>
