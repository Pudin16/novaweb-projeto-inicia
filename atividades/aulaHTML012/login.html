
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>
    <main class="container">
        <form id="formLogin">
            <h1>Bem-vindo!</h1>
            <p class="subtitulo">Entre na sua conta</p>
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >
            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
                minlength="6"
            >
            <a href="#" id="recuperar">Esqueci minha senha</a>
            <button type="submit">Entrar</button>
            <p class="cadastro">
                Não tem uma conta?
                <a href="#" id="cadastrar">Cadastre-se</a>
            </p>
            <p id="mensagem" role="status"></p>
        </form>
    </main>
</body>
</html>
