
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="admin.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <header>
        <h1>Painel Administrativo</h1>
        <p>Gerenciamento de usuários</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Dados do usuário</h2>

            <form id="formUsuario">
                <input type="hidden" id="id">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" min="1" required>

                <button type="submit">Salvar alterações</button>
                <button type="button" id="limpar">Limpar campos</button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section class="tabela">
            <h2>Lista de usuários</h2>
            <p>Clique em uma linha para visualizar ou editar os dados.</p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Idade</th>
                    </tr>
                </thead>
                <tbody id="listaUsuarios">
                    <tr data-id="1">
                        <td>1</td>
                        <td>Lucas Silva</td>
                        <td>lucas@email.com</td>
                        <td>18</td>
                    </tr>
                    <tr data-id="2">
                        <td>2</td>
                        <td>Mariana Souza</td>
                        <td>mariana@email.com</td>
                        <td>20</td>
                    </tr>
                    <tr data-id="3">
                        <td>3</td>
                        <td>Pedro Santos</td>
                        <td>pedro@email.com</td>
                        <td>17</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
